name: Continuous Integration - Pedidos

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test-pedidos:
    name: Test Pedidos (Django)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: pedidos_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          # Django 6.1.3 exige Python >= 3.12.
          python-version: '3.12'
          cache: 'pip'
          # Este workflow corre dentro del repo de Pedidos: no lleva prefijo de carpeta.
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django unit tests
        env:
          # Sin DB_ENGINE=postgresql los tests usarían SQLite y el servicio quedaría sin uso.
          DB_ENGINE: postgresql
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: pedidos_db
          DB_USER: test_user
          DB_PASSWORD: test_password
          SECRET_KEY: test_secret_key_para_ci_sin_usar_en_produccion
          JWT_SIGNING_KEY: test_jwt_signing_key_para_ci
        run: python manage.py test
